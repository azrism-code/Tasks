name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "native-bridge.js"
      - "index.html"
      - "app.js"
      - "data-store.js"
      - "reminders.js"
      - "firebase-config.js"
      - "style.css"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "icon.svg"
      - "header-logo.svg"
      - "android-icons/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: npm run prepare:android

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Android permissions
        run: node scripts/patch-android.mjs

      - name: Restore Android signing key
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/my-tasks-signing"
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-tasks-signing/my-tasks.keystore"

      - name: Build debug APK
        working-directory: android
        env:
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/my-tasks-signing/my-tasks.keystore" \
            -Pandroid.injected.signing.store.password="$APK_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$APK_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$APK_KEY_PASSWORD"

      - name: Package APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk My-Tasks-v2.5.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Tasks-v2.5.1-Android
          path: My-Tasks-v2.5.1-debug.apk
          if-no-files-found: error
          retention-days: 30
