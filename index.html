<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10213f">
  <meta name="description" content="A simple bilingual task manager">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <title>Azri Tasks</title>
</head>
<body>
  <div id="login" class="login-screen">
    <div class="login-card">
      <span class="brand-mark">✓</span>
      <h1>Azri Tasks</h1>
      <p>Simple tasks. Available everywhere.</p>
      <button id="loginBtn" class="primary-btn">Continue with Google</button>
    </div>
  </div>

  <main id="app" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✓</span><span>Tasks</span></div>
      <nav class="main-nav">
        <button data-view="tasks" class="active">⌂ <span data-i18n="tasks">Tasks</span></button>
        <button data-view="history">↶ <span data-i18n="history">History</span></button>
      </nav>
      <p class="side-label" data-i18n="areas">Areas</p>
      <nav class="area-nav">
        <button data-area="work" class="active">▣ <span data-i18n="work">Work</span><b id="workCount">0</b></button>
        <button data-area="private">⌂ <span data-i18n="private">Private</span><b id="privateCount">0</b></button>
      </nav>
      <div class="spacer"></div>
      <button id="languageBtn" class="outline-btn">עברית</button>
      <button id="logoutBtn" class="user-button"><span id="userName"></span><small data-i18n="signout">Sign out</small></button>
    </aside>

    <section class="workspace">
      <header class="mobile-header">
        <div class="brand"><span class="brand-mark">✓</span><span>Tasks</span></div>
        <button id="mobileLanguageBtn" class="outline-btn">עב</button>
      </header>
      <div class="mobile-view-switch">
        <button data-view="tasks" class="active" data-i18n="tasks">Tasks</button>
        <button data-view="history" data-i18n="history">History</button>
      </div>
      <div class="content">
        <div class="top-row">
          <div><div id="viewLabel" class="eyebrow">TASKS</div><h1 id="areaTitle">Work</h1></div>
          <button id="addTaskTop" class="primary-btn">＋ <span data-i18n="addTask">Add task</span></button>
        </div>
        <div class="mobile-area-switch">
          <button data-area="work" class="active" data-i18n="work">Work</button>
          <button data-area="private" data-i18n="private">Private</button>
        </div>
        <div id="categoryTabs" class="category-tabs"></div>
        <div class="list-heading">
          <div><h2 id="categoryTitle"></h2><span id="taskCount"></span></div>
          <button id="categoryMenuBtn" class="icon-btn" aria-label="List options">•••</button>
        </div>
        <section id="taskList" class="task-list"></section>
      </div>
      <button id="addTaskFab" class="fab">＋</button>
    </section>
  </main>

  <dialog id="taskDialog">
    <form method="dialog" id="taskForm">
      <header><div><h2 id="taskDialogTitle">New task</h2><p id="taskDialogCategory"></p></div><button value="cancel" class="close-btn">×</button></header>
      <textarea id="taskText" rows="5" required></textarea>
      <footer><button value="cancel" class="secondary-btn" data-i18n="cancel">Cancel</button><button id="saveTaskBtn" value="default" class="primary-btn" data-i18n="save">Save</button></footer>
    </form>
  </dialog>

  <dialog id="categoryDialog">
    <form method="dialog" id="categoryForm">
      <header><h2 id="categoryDialogTitle">New list</h2><button value="cancel" class="close-btn">×</button></header>
      <input id="categoryName" required>
      <footer><button value="cancel" class="secondary-btn" data-i18n="cancel">Cancel</button><button value="default" class="primary-btn" data-i18n="save">Save</button></footer>
    </form>
  </dialog>

  <dialog id="moveDialog">
    <form method="dialog" id="moveForm">
      <header><h2 data-i18n="moveTask">Move task</h2><button value="cancel" class="close-btn">×</button></header>
      <select id="moveTarget"></select>
      <footer><button value="cancel" class="secondary-btn" data-i18n="cancel">Cancel</button><button value="default" class="primary-btn" data-i18n="move">Move</button></footer>
    </form>
  </dialog>

  <dialog id="confirmDialog">
    <form method="dialog" id="confirmForm">
      <header><h2 id="confirmTitle"></h2><button value="cancel" class="close-btn">×</button></header>
      <p id="confirmBody"></p>
      <footer><button value="cancel" class="secondary-btn" data-i18n="cancel">Cancel</button><button id="confirmButton" value="default" class="danger-btn">Confirm</button></footer>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
