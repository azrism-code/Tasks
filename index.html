<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10213f">
  <meta name="description" content="A simple bilingual task manager">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css?v=1.7.0-49af23ee">
  <title>Azri Tasks v1.7.0</title>
</head>
<body>
  <div id="login" class="login-screen">
    <div class="login-card">
      <span class="brand-mark">✓</span>
      <h1>Azri Tasks</h1>
      <p>המשימות שלך, פשוט ובכל מקום.</p>
      <button id="loginBtn" class="primary-btn">התחברות עם Google</button>
    </div>
  </div>

  <main id="app" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✓</span><span>משימות</span><small class="version">v1.7.0</small></div>
      <p class="side-label" data-i18n="areas">Areas</p>
      <nav class="area-nav">
        <button data-area="work" class="active">▣ <span data-i18n="work">Work</span><b id="workCount">0</b></button>
        <button data-area="private">⌂ <span data-i18n="private">Private</span><b id="privateCount">0</b></button>
      </nav>
      <div class="spacer"></div>
      <button id="logoutBtn" class="user-button"><span id="userName"></span><small data-i18n="signout">Sign out</small></button>
    </aside>

    <section class="workspace">
      <header class="mobile-header">
        <div class="brand"><span class="brand-mark">✓</span><span>משימות</span><small class="version">v1.7.0</small></div>
        <button class="app-menu-btn icon-btn" aria-label="Menu">⋮</button>
      </header>
      <div class="content">
        <div class="desktop-toolbar"><button class="app-menu-btn icon-btn" aria-label="Menu">⋮</button></div>
        <div id="viewTitle" class="view-title hidden">היסטוריה</div>
        <div class="mobile-area-switch">
          <button data-area="work" class="active" data-i18n="work">Work</button>
          <button data-area="private" data-i18n="private">Private</button>
        </div>
        <div id="categoryTabs" class="category-tabs"></div>
        <button id="toggleCategoriesBtn" class="toggle-categories hidden" type="button">הצג הכל</button>
        <div class="list-heading">
          <div><h2 id="categoryTitle"></h2><span id="taskCount"></span></div>
          <div class="list-actions"><button id="addTaskTop" class="primary-btn">＋ <span data-i18n="addTask">Add task</span></button><button id="categoryMenuBtn" class="icon-btn" aria-label="List options">•••</button></div>
        </div>
        <section id="taskList" class="task-list"></section>
      </div>
      <button id="addTaskFab" class="fab">＋</button>
    </section>
  </main>

  <div id="appMenu" class="app-menu hidden">
    <button data-menu-view="tasks">⌂ <span data-i18n="tasks">Tasks</span></button>
    <button data-menu-view="history">↶ <span data-i18n="history">History</span></button>
    <button id="menuLogoutBtn">↪ <span>יציאה</span></button>
  </div>

  <dialog id="taskDialog">
    <form method="dialog" id="taskForm">
      <header><div><h2 id="taskDialogTitle">New task</h2><p id="taskDialogCategory"></p></div><button type="button" data-close-dialog="taskDialog" class="close-btn">×</button></header>
      <textarea id="taskText" rows="5" required></textarea>
      <div class="voice-entry"><button id="voiceTaskBtn" type="button" class="voice-dialog-btn">🎙️ <span>הקלט</span></button><small id="voiceStatus" aria-live="polite"></small></div>
      <footer><button type="button" data-close-dialog="taskDialog" class="secondary-btn" data-i18n="cancel">Cancel</button><button id="saveTaskBtn" type="submit" class="primary-btn" data-i18n="save">Save</button></footer>
    </form>
  </dialog>

  <dialog id="categoryDialog">
    <form method="dialog" id="categoryForm">
      <header><h2 id="categoryDialogTitle">New list</h2><button type="button" data-close-dialog="categoryDialog" class="close-btn">×</button></header>
      <input id="categoryName" dir="auto" required>
      <footer><button type="button" data-close-dialog="categoryDialog" class="secondary-btn" data-i18n="cancel">Cancel</button><button type="submit" class="primary-btn" data-i18n="save">Save</button></footer>
    </form>
  </dialog>

  <dialog id="moveDialog">
    <form method="dialog" id="moveForm">
      <header><h2 data-i18n="moveTask">Move task</h2><button type="button" data-close-dialog="moveDialog" class="close-btn">×</button></header>
      <select id="moveTarget"></select>
      <footer><button type="button" data-close-dialog="moveDialog" class="secondary-btn" data-i18n="cancel">Cancel</button><button type="submit" class="primary-btn" data-i18n="move">Move</button></footer>
    </form>
  </dialog>

  <dialog id="confirmDialog">
    <form method="dialog" id="confirmForm">
      <header><h2 id="confirmTitle"></h2><button type="button" data-close-dialog="confirmDialog" class="close-btn">×</button></header>
      <p id="confirmBody"></p>
      <footer><button type="button" data-close-dialog="confirmDialog" class="secondary-btn" data-i18n="cancel">Cancel</button><button id="confirmButton" type="submit" class="danger-btn">Confirm</button></footer>
    </form>
  </dialog>

  <div id="toast" class="toast"></div>
  <script type="module" src="./app.js?v=1.7.0-fa752042"></script>
</body>
</html>
